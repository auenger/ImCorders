<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7894ff"/></marker></defs>
<rect width="1600" height="900" fill="#0b1015"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<text x="72" y="76" font-size="19" fill="#9ba9b7" font-weight="600" text-anchor="start">AGENT-FIRST SOFTWARE  /  01</text>
<text x="72" y="143" font-size="44" fill="#f1f4f8" font-weight="600" text-anchor="start">把核心能力放在服务层</text>
<text x="72" y="191" font-size="25" fill="#9ba9b7" font-weight="400" text-anchor="start">人表达目标，Agent 组织请求，数据库服务负责可靠执行</text>
<rect x="72" y="280" width="330" height="400" rx="18" fill="#121b26" stroke="#7894ff" stroke-width="2"/>
<text x="108" y="339" font-size="32" fill="#f1f4f8" font-weight="600" text-anchor="start">人 + Agent</text>
<text x="108" y="389" font-size="23" fill="#9ba9b7" font-weight="400" text-anchor="start">运营 · 增长 · 数据分析</text>
<text x="108" y="477" font-size="27" fill="#f1f4f8" font-weight="400" text-anchor="start">提出业务问题</text>
<text x="108" y="540" font-size="27" fill="#f1f4f8" font-weight="400" text-anchor="start">理解数据语义</text>
<text x="108" y="603" font-size="27" fill="#f1f4f8" font-weight="400" text-anchor="start">组织查询请求</text>
<rect x="560" y="260" width="480" height="440" rx="18" fill="#191625" stroke="#b399ff" stroke-width="2"/>
<text x="598" y="325" font-size="34" fill="#f1f4f8" font-weight="600" text-anchor="start">Chat2DB 服务</text>
<text x="598" y="370" font-size="23" fill="#b399ff" font-weight="400" text-anchor="start">MCP / API</text>
<text x="598" y="445" font-size="28" fill="#f1f4f8" font-weight="400" text-anchor="start">连接与表结构</text>
<text x="598" y="507" font-size="28" fill="#f1f4f8" font-weight="400" text-anchor="start">身份与权限校验</text>
<text x="598" y="569" font-size="28" fill="#f1f4f8" font-weight="400" text-anchor="start">查询执行与结果</text>
<text x="598" y="631" font-size="28" fill="#f1f4f8" font-weight="400" text-anchor="start">访问记录与审计</text>
<rect x="1198" y="280" width="330" height="400" rx="18" fill="#111e1a" stroke="#3d886a" stroke-width="2"/>
<text x="1234" y="341" font-size="32" fill="#f1f4f8" font-weight="600" text-anchor="start">数据库</text>
<text x="1234" y="454" font-size="27" fill="#f1f4f8" font-weight="400" text-anchor="start">业务数据库</text>
<text x="1234" y="520" font-size="27" fill="#f1f4f8" font-weight="400" text-anchor="start">数仓 / 分析库</text>
<text x="1234" y="586" font-size="27" fill="#f1f4f8" font-weight="400" text-anchor="start">受控数据范围</text>
<path d="M 402 479 H 560" fill="none" stroke="#7894ff" stroke-width="3" marker-end="url(#arrow)"/>
<text x="481" y="453" font-size="22" fill="#9ba9b7" font-weight="400" text-anchor="middle">请求</text>
<path d="M 1040 479 H 1198" fill="none" stroke="#7894ff" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1119" y="453" font-size="22" fill="#9ba9b7" font-weight="400" text-anchor="middle">执行</text>
<path d="M 72 790 H 1528" fill="none" stroke="#293440" stroke-width="3"/>
<text x="72" y="843" font-size="27" fill="#86efac" font-weight="600" text-anchor="start">稳定的能力、清楚的边界，比完整复刻一个客户端更优先。</text>
</svg>