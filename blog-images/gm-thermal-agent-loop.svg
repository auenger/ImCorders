<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <style>
    text { font-family: -apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.18em; fill: #d4a574; }
    .title { font-family: Georgia,"Times New Roman","PingFang SC",serif; font-size: 34px; font-weight: 700; fill: #f5f0eb; }
    .subtitle { font-size: 16px; fill: #a39787; }
    .node { font-size: 15px; font-weight: 700; }
    .detail { font-size: 11px; fill: #a39787; }
    .step { font-size: 12px; font-weight: 700; fill: #0a0a0a; }
    .small { font-size: 11px; fill: #8c7e72; }
    .pill { font-size: 11px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr-gold3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
    <marker id="arr-mint3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6ee7b7"/></marker>
    <marker id="arr-violet3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <radialGradient id="gmGlow" cx="68%" cy="48%" r="38%"><stop offset="0%" stop-color="#d4a574" stop-opacity="0.07"/><stop offset="100%" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="740" fill="#0a0a0a"/>
  <rect width="1200" height="740" fill="url(#gmGlow)"/>
  <text x="60" y="55" class="eyebrow">GM THERMAL SIMULATION</text>
  <text x="60" y="102" class="title">Agent 扩展搜索空间，业务专家决定优化方向</text>
  <text x="60" y="136" class="subtitle">每一个候选方案都来自 GM 内部专家经验与当前仿真证据，而不是模型的自由猜测。</text>

  <ellipse cx="790" cy="202" rx="250" ry="18" fill="#10211d" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="540" y="202" width="500" height="54" fill="#10211d"/>
  <line x1="540" y1="202" x2="540" y2="256" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="1040" y1="202" x2="1040" y2="256" stroke="#6ee7b7" stroke-width="1.5"/>
  <ellipse cx="790" cy="256" rx="250" ry="18" fill="#0c1916" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="790" y="225" text-anchor="middle" class="node" fill="#6ee7b7">GM 内部专家经验库</text>
  <text x="790" y="247" text-anchor="middle" class="detail">调优规则 · 有效方案 · 失败案例 · 参数边界 · 风险约束</text>

  <rect x="45" y="326" width="162" height="102" rx="10" fill="#111111" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="70" cy="348" r="13" fill="#94a3b8"/><text x="70" y="352" text-anchor="middle" class="step">1</text>
  <text x="126" y="359" text-anchor="middle" class="node" fill="#f5f0eb">提交任务</text>
  <text x="126" y="386" text-anchor="middle" class="detail">冻结输入与模型快照</text>
  <text x="126" y="406" text-anchor="middle" class="detail">确定验收与调优边界</text>

  <rect x="257" y="326" width="162" height="102" rx="10" fill="#111111" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="282" cy="348" r="13" fill="#38bdf8"/><text x="282" y="352" text-anchor="middle" class="step">2</text>
  <text x="338" y="359" text-anchor="middle" class="node" fill="#38bdf8">基线求解</text>
  <text x="338" y="386" text-anchor="middle" class="detail">调用 Icepak</text>
  <text x="338" y="406" text-anchor="middle" class="detail">生成当前仿真结果</text>

  <rect x="469" y="326" width="162" height="102" rx="10" fill="#111111" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="494" cy="348" r="13" fill="#fbbf24"/><text x="494" y="352" text-anchor="middle" class="step">3</text>
  <text x="550" y="359" text-anchor="middle" class="node" fill="#fbbf24">规则判断</text>
  <text x="550" y="386" text-anchor="middle" class="detail">PASS / FAIL / 异常</text>
  <text x="550" y="406" text-anchor="middle" class="detail">确定性标准先判定</text>

  <rect x="681" y="326" width="206" height="102" rx="10" fill="#111111" stroke="#a78bfa" stroke-width="1.8"/>
  <circle cx="706" cy="348" r="13" fill="#a78bfa"/><text x="706" y="352" text-anchor="middle" class="step">4</text>
  <text x="784" y="359" text-anchor="middle" class="node" fill="#a78bfa">Agent 生成 2–4 个方案</text>
  <text x="784" y="386" text-anchor="middle" class="detail">召回内部经验并比较历史效果</text>
  <text x="784" y="406" text-anchor="middle" class="detail">说明动作、证据、风险与预期影响</text>

  <rect x="937" y="310" width="218" height="134" rx="12" fill="#1a1a1a" stroke="#e8c49a" stroke-width="2.5"/>
  <circle cx="964" cy="334" r="14" fill="#e8c49a"/><text x="964" y="338" text-anchor="middle" class="step">5</text>
  <text x="1046" y="350" text-anchor="middle" class="node" fill="#e8c49a">业务专家确认</text>
  <text x="1046" y="379" text-anchor="middle" class="detail">比较证据、风险和预期影响</text>
  <text x="1046" y="400" text-anchor="middle" class="detail">选择单一方向或全部驳回</text>
  <text x="1046" y="421" text-anchor="middle" class="small">关键决策点</text>

  <path d="M207 377 H248" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold3)"/>
  <path d="M419 377 H460" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold3)"/>
  <path d="M631 377 H672" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold3)"/>
  <path d="M887 377 H928" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold3)"/>
  <path d="M790 274 V317" stroke="#6ee7b7" stroke-width="1.7" marker-end="url(#arr-mint3)"/>
  <text x="804" y="301" class="small">召回</text>

  <rect x="728" y="520" width="188" height="86" rx="10" fill="#111111" stroke="#5a9e6f" stroke-width="1.5"/>
  <circle cx="753" cy="542" r="13" fill="#5a9e6f"/><text x="753" y="546" text-anchor="middle" class="step">6</text>
  <text x="822" y="554" text-anchor="middle" class="node" fill="#5a9e6f">应用选中方案</text>
  <text x="822" y="580" text-anchor="middle" class="detail">只修改工作副本</text>
  <text x="822" y="598" text-anchor="middle" class="detail">生成新模型版本</text>

  <rect x="469" y="520" width="188" height="86" rx="10" fill="#111111" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="494" cy="542" r="13" fill="#38bdf8"/><text x="494" y="546" text-anchor="middle" class="step">7</text>
  <text x="563" y="554" text-anchor="middle" class="node" fill="#38bdf8">下一轮求解</text>
  <text x="563" y="580" text-anchor="middle" class="detail">重新仿真并判断</text>
  <text x="563" y="598" text-anchor="middle" class="detail">保留完整迭代记录</text>

  <rect x="210" y="520" width="188" height="86" rx="10" fill="#17131e" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="235" cy="542" r="13" fill="#a78bfa"/><text x="235" y="546" text-anchor="middle" class="step">8</text>
  <text x="304" y="554" text-anchor="middle" class="node" fill="#a78bfa">经验回流</text>
  <text x="304" y="580" text-anchor="middle" class="detail">记录选择与驳回原因</text>
  <text x="304" y="598" text-anchor="middle" class="detail">形成新案例与评测</text>

  <path d="M1046 444 V478 H822 V511" stroke="#d4a574" stroke-width="2" fill="none" marker-end="url(#arr-gold3)"/>
  <path d="M728 563 H666" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold3)"/>
  <path d="M469 563 H407" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr-violet3)"/>
  <path d="M210 563 H25 V244 H531" stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-violet3)"/>
  <text x="42" y="237" class="small">专家确认后沉淀</text>

  <rect x="60" y="660" width="226" height="34" rx="17" fill="#221414" stroke="#7f3636"/>
  <text x="173" y="682" text-anchor="middle" class="pill" fill="#f87171">禁止未经确认修改模型</text>
  <rect x="304" y="660" width="206" height="34" rx="17" fill="#221414" stroke="#7f3636"/>
  <text x="407" y="682" text-anchor="middle" class="pill" fill="#f87171">禁止自行放宽指标</text>
  <rect x="528" y="660" width="214" height="34" rx="17" fill="#221414" stroke="#7f3636"/>
  <text x="635" y="682" text-anchor="middle" class="pill" fill="#f87171">禁止绕过风险边界</text>
  <text x="1140" y="682" text-anchor="end" class="subtitle">系统执行确定动作，专家掌握优化方向。</text>
</svg>
