<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="title desc">
  <title id="title">Chat2DB 与 DSH 的职责架构</title>
  <desc id="desc">用户目标进入 DSH Runtime，经 Plugin 授权桥接到 Chat2DB 控制面，再调用数据库领域能力。</desc>
  <defs>
    <pattern id="grid2" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#26303a"/></pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#95a2b1"/></marker>
  </defs>
  <rect width="1600" height="960" fill="#0b0f14"/>
  <rect width="1600" height="960" fill="url(#grid2)" opacity=".34"/>
  <text x="76" y="75" fill="#8996a5" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" letter-spacing="3">RUNTIME × PLUGIN × APP</text>
  <text x="76" y="132" fill="#f5f7f9" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="42" font-weight="750">不是谁集成谁，而是三层各守边界</text>
  <text x="76" y="170" fill="#9da8b5" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="20">推理可以外接，业务权限与责任仍由原 App 掌握</text>

  <g font-family="Inter,Arial,'PingFang SC',sans-serif">
    <rect x="70" y="240" width="340" height="540" rx="16" fill="#111925" stroke="#38549e" stroke-width="2"/>
    <circle cx="125" cy="302" r="31" fill="#e9eeff"/><image href="dsh-whale.svg" x="103" y="280" width="44" height="44"/>
    <text x="172" y="294" fill="#f4f6f8" font-size="25" font-weight="750">DSH Runtime</text>
    <text x="172" y="322" fill="#89a0ff" font-size="15">通用推理与执行平面</text>
    <line x1="102" y1="354" x2="378" y2="354" stroke="#273444"/>
    <g fill="#c7d0da" font-size="18">
      <text x="108" y="409">01  目标理解</text><text x="108" y="459">02  多步规划</text>
      <text x="108" y="509">03  会话与上下文</text><text x="108" y="559">04  工具选择与编排</text>
      <text x="108" y="609">05  Skills 与协作</text>
    </g>
    <rect x="104" y="676" width="272" height="66" rx="8" fill="#17233a"/>
    <text x="240" y="704" text-anchor="middle" fill="#89a0ff" font-size="15">决定</text>
    <text x="240" y="727" text-anchor="middle" fill="#f2f5f7" font-size="17" font-weight="700">下一步想做什么</text>

    <rect x="496" y="300" width="252" height="420" rx="14" fill="#161d24" stroke="#7f8d9b" stroke-width="2"/>
    <text x="622" y="360" text-anchor="middle" fill="#f4f6f8" font-size="25" font-weight="750">DSH Plugin</text>
    <text x="622" y="393" text-anchor="middle" fill="#9ba7b4" font-size="15">受控能力桥</text>
    <line x1="530" y1="422" x2="714" y2="422" stroke="#35404a"/>
    <g text-anchor="middle" font-size="17">
      <text x="622" y="474" fill="#d4dbe2">App 配对授权</text>
      <text x="622" y="522" fill="#d4dbe2">Token 轮换</text>
      <text x="622" y="570" fill="#d4dbe2">Tool 动态注册</text>
      <text x="622" y="618" fill="#d4dbe2">状态与审计关联</text>
    </g>
    <rect x="528" y="654" width="188" height="42" rx="7" fill="#252d35"/>
    <text x="622" y="681" text-anchor="middle" fill="#8cff5a" font-size="15" font-weight="700">不持有数据库凭据</text>

    <rect x="834" y="240" width="410" height="540" rx="16" fill="#17131e" stroke="#6a3cff" stroke-width="2"/>
    <circle cx="892" cy="302" r="31" fill="#f0ebff"/><image href="chat2db-mark.svg" x="869" y="279" width="46" height="46"/>
    <text x="940" y="294" fill="#f4f6f8" font-size="25" font-weight="750">Chat2DB Control Plane</text>
    <text x="940" y="322" fill="#b491ff" font-size="15">数据库领域业务控制面</text>
    <line x1="870" y1="354" x2="1208" y2="354" stroke="#392b50"/>
    <g fill="#d4cbed" font-size="18">
      <text x="878" y="409">Agent 身份与 Capability</text><text x="878" y="459">DataScope 与 DataWiki</text>
      <text x="878" y="509">SQL Proposal 与 Approval</text><text x="878" y="559">Task · Run · ToolAttempt</text>
      <text x="878" y="609">幂等、审计与业务状态</text>
    </g>
    <rect x="870" y="676" width="338" height="66" rx="8" fill="#281d3b"/>
    <text x="1039" y="704" text-anchor="middle" fill="#b491ff" font-size="15">决定</text>
    <text x="1039" y="727" text-anchor="middle" fill="#f2f5f7" font-size="17" font-weight="700">这一步能不能做、如何负责</text>

    <rect x="1330" y="300" width="200" height="420" rx="14" fill="#101a18" stroke="#3e9868" stroke-width="2"/>
    <text x="1430" y="360" text-anchor="middle" fill="#f4f6f8" font-size="23" font-weight="750">领域能力</text>
    <text x="1430" y="393" text-anchor="middle" fill="#70d69b" font-size="15">Database Tools</text>
    <line x1="1362" y1="422" x2="1498" y2="422" stroke="#264337"/>
    <g text-anchor="middle" fill="#bcd8c7" font-size="17">
      <text x="1430" y="478">元数据</text><text x="1430" y="526">SQL 查询</text>
      <text x="1430" y="574">变更执行</text><text x="1430" y="622">结果与证据</text>
    </g>
  </g>
  <path d="M410 510h74" stroke="#95a2b1" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M748 510h74" stroke="#95a2b1" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M1244 510h74" stroke="#95a2b1" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M1318 584h-62" stroke="#667382" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a2)"/>
  <text x="800" y="874" text-anchor="middle" fill="#8cff5a" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700">能力可以映射，责任不能外包</text>
</svg>
