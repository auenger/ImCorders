<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text { font-family: -apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.18em; fill: #d4a574; }
    .title { font-family: Georgia,"Times New Roman","PingFang SC",serif; font-size: 34px; font-weight: 700; fill: #f5f0eb; }
    .subtitle { font-size: 16px; fill: #a39787; }
    .node { font-size: 16px; font-weight: 700; }
    .detail { font-size: 12px; fill: #a39787; }
    .small { font-size: 11px; fill: #8c7e72; }
    .legend { font-size: 11px; fill: #a39787; }
  </style>
  <defs>
    <marker id="arr-gold2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
    <marker id="arr-mint2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6ee7b7"/></marker>
    <marker id="arr-violet2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <radialGradient id="ecoGlow" cx="50%" cy="42%" r="42%"><stop offset="0%" stop-color="#d4a574" stop-opacity="0.08"/><stop offset="100%" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="760" fill="#0a0a0a"/>
  <rect width="1200" height="760" fill="url(#ecoGlow)"/>
  <text x="60" y="55" class="eyebrow">EXPERT AGENT ECOSYSTEM</text>
  <text x="60" y="102" class="title">给领域专家打造一套 AI Agent 生态</text>
  <text x="60" y="136" class="subtitle">专家生产判断，Agent 扩大覆盖，反馈让内部经验持续演进。</text>

  <rect x="420" y="174" width="360" height="92" rx="12" fill="#1a1a1a" stroke="#e8c49a" stroke-width="2"/>
  <circle cx="468" cy="220" r="20" fill="none" stroke="#e8c49a" stroke-width="1.8"/>
  <circle cx="468" cy="213" r="7" fill="none" stroke="#e8c49a" stroke-width="1.5"/>
  <path d="M456 235 Q456 220 468 220 Q480 220 480 235" fill="none" stroke="#e8c49a" stroke-width="1.5"/>
  <text x="505" y="211" class="node" fill="#e8c49a">业务专家</text>
  <text x="505" y="234" class="detail">定义规则 · 处理例外 · 选择方向 · 修正系统</text>
  <text x="505" y="253" class="small">关键决策权始终保留在人手里</text>

  <path d="M600 266 V302" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold2)"/>
  <text x="612" y="288" class="small">沉淀</text>
  <ellipse cx="600" cy="326" rx="170" ry="20" fill="#10211d" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="430" y="326" width="340" height="58" fill="#10211d"/>
  <line x1="430" y1="326" x2="430" y2="384" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="770" y1="326" x2="770" y2="384" stroke="#6ee7b7" stroke-width="1.5"/>
  <ellipse cx="600" cy="384" rx="170" ry="20" fill="#0c1916" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="600" y="351" text-anchor="middle" class="node" fill="#6ee7b7">企业内部专家经验库</text>
  <text x="600" y="374" text-anchor="middle" class="detail">规则 · 历史案例 · 失败经验 · 风险边界 · 验收标准</text>

  <rect x="35" y="452" width="174" height="96" rx="10" fill="#111111" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="122" y="485" text-anchor="middle" class="node" fill="#a78bfa">入口 Agent</text>
  <text x="122" y="509" text-anchor="middle" class="detail">识别问题类型</text>
  <text x="122" y="529" text-anchor="middle" class="detail">补齐必要输入</text>

  <rect x="273" y="452" width="174" height="96" rx="10" fill="#111111" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="485" text-anchor="middle" class="node" fill="#38bdf8">知识 Agent</text>
  <text x="360" y="509" text-anchor="middle" class="detail">召回规则与案例</text>
  <text x="360" y="529" text-anchor="middle" class="detail">给出证据来源</text>

  <rect x="511" y="452" width="174" height="96" rx="10" fill="#111111" stroke="#5a9e6f" stroke-width="1.5"/>
  <text x="598" y="485" text-anchor="middle" class="node" fill="#5a9e6f">执行 Agent</text>
  <text x="598" y="509" text-anchor="middle" class="detail">运行稳定流程</text>
  <text x="598" y="529" text-anchor="middle" class="detail">生成业务产物</text>

  <rect x="749" y="452" width="174" height="96" rx="10" fill="#111111" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="836" y="485" text-anchor="middle" class="node" fill="#fbbf24">质检 Agent</text>
  <text x="836" y="509" text-anchor="middle" class="detail">检查证据与边界</text>
  <text x="836" y="529" text-anchor="middle" class="detail">低置信度升级专家</text>

  <rect x="987" y="452" width="178" height="96" rx="10" fill="#111111" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1076" y="485" text-anchor="middle" class="node" fill="#f5f0eb">稳定业务输出</text>
  <text x="1076" y="509" text-anchor="middle" class="detail">非专家也能达到</text>
  <text x="1076" y="529" text-anchor="middle" class="detail">组织质量底线</text>

  <path d="M209 500 H264" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold2)"/>
  <path d="M447 500 H502" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold2)"/>
  <path d="M685 500 H740" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold2)"/>
  <path d="M923 500 H978" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold2)"/>

  <path d="M495 401 V425 H360 V443" stroke="#6ee7b7" stroke-width="1.6" fill="none" marker-end="url(#arr-mint2)"/>
  <text x="382" y="422" class="small">检索内部经验</text>
  <path d="M705 401 V425 H836 V443" stroke="#d4a574" stroke-width="1.6" fill="none" marker-end="url(#arr-gold2)"/>
  <text x="716" y="422" class="small">注入评审边界</text>

  <rect x="488" y="622" width="224" height="72" rx="10" fill="#17131e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="652" text-anchor="middle" class="node" fill="#a78bfa">学习 Agent</text>
  <text x="600" y="676" text-anchor="middle" class="detail">记录专家修正，形成新案例与评测</text>
  <path d="M836 548 V584 H712 V613" stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-violet2)"/>
  <text x="745" y="580" class="small">接管原因与修改意见</text>
  <path d="M488 658 H402 V364 H421" stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-violet2)"/>
  <text x="414" y="607" class="small">确认后回流</text>

  <line x1="60" y1="724" x2="90" y2="724" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold2)"/>
  <text x="102" y="728" class="legend">业务主流程</text>
  <line x1="230" y1="724" x2="260" y2="724" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#arr-mint2)"/>
  <text x="272" y="728" class="legend">经验读取</text>
  <line x1="380" y1="724" x2="410" y2="724" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr-violet2)"/>
  <text x="422" y="728" class="legend">学习反馈</text>
  <text x="1140" y="728" text-anchor="end" class="legend">专家不是流程瓶颈，而是生态的判断核心</text>
</svg>
