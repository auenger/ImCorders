<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <style>
    text { font-family: -apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.18em; fill: #d4a574; }
    .title { font-family: Georgia,"Times New Roman","PingFang SC",serif; font-size: 34px; font-weight: 700; fill: #f5f0eb; }
    .subtitle { font-size: 16px; fill: #a39787; }
    .panel-title { font-size: 22px; font-weight: 700; fill: #f5f0eb; }
    .panel-sub { font-size: 14px; fill: #a39787; }
    .node-title { font-size: 16px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #a39787; }
    .tag { font-size: 13px; font-weight: 700; }
    .tiny { font-size: 11px; fill: #6b5f53; }
  </style>
  <defs>
    <marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#6b5f53"/></marker>
    <marker id="arr-mint" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6ee7b7"/></marker>
    <radialGradient id="goldGlow" cx="75%" cy="58%" r="36%"><stop offset="0%" stop-color="#d4a574" stop-opacity="0.09"/><stop offset="100%" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#goldGlow)"/>

  <text x="60" y="55" class="eyebrow">AI × ORGANIZATION</text>
  <text x="60" y="102" class="title">AI 压缩信息差，但会放大判断力</text>
  <text x="60" y="136" class="subtitle">同样处在中层位置，传话型角色与专家型角色正在走向两个方向。</text>

  <rect x="60" y="180" width="500" height="420" rx="16" fill="#111111" stroke="#2d2a27" stroke-width="1.5"/>
  <text x="92" y="224" class="panel-title">传话型中层</text>
  <text x="92" y="250" class="panel-sub">价值来自信息经过自己</text>

  <rect x="105" y="306" width="118" height="72" rx="8" fill="#171717" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="164" y="336" text-anchor="middle" class="node-title" fill="#94a3b8">上级信息</text>
  <text x="164" y="358" text-anchor="middle" class="node-sub">目标与要求</text>
  <path d="M223 342 H272" stroke="#6b5f53" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-gray)"/>

  <rect x="280" y="292" width="138" height="100" rx="10" fill="#1a1a1a" stroke="#f87171" stroke-width="1.8"/>
  <circle cx="349" cy="321" r="13" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <path d="M330 356 Q330 337 349 337 Q368 337 368 356" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <text x="349" y="378" text-anchor="middle" class="node-title" fill="#f87171">转发与汇总</text>
  <path d="M418 342 H467" stroke="#6b5f53" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-gray)"/>

  <rect x="475" y="306" width="50" height="72" rx="8" fill="#171717" stroke="#94a3b8" stroke-width="1.3"/>
  <circle cx="500" cy="330" r="8" fill="none" stroke="#94a3b8"/>
  <path d="M488 356 Q488 341 500 341 Q512 341 512 356" fill="none" stroke="#94a3b8"/>

  <line x1="126" y1="433" x2="494" y2="433" stroke="#2d2a27"/>
  <text x="92" y="474" class="tag" fill="#f87171">AI 直接连接上下游</text>
  <text x="92" y="505" class="panel-sub">信息搬运、任务转发和过程汇报被压缩</text>
  <rect x="92" y="538" width="146" height="34" rx="17" fill="#2a1717" stroke="#7f3636"/>
  <text x="165" y="560" text-anchor="middle" class="tag" fill="#f87171">价值快速下降</text>

  <rect x="640" y="180" width="500" height="420" rx="16" fill="#111111" stroke="#5a4634" stroke-width="1.5"/>
  <text x="672" y="224" class="panel-title">专家型中层</text>
  <text x="672" y="250" class="panel-sub">价值来自判断、例外与业务边界</text>

  <circle cx="890" cy="355" r="76" fill="#1a1a1a" stroke="#e8c49a" stroke-width="2.5"/>
  <circle cx="890" cy="337" r="17" fill="none" stroke="#e8c49a" stroke-width="2"/>
  <path d="M860 383 Q860 350 890 350 Q920 350 920 383" fill="none" stroke="#e8c49a" stroke-width="2"/>
  <text x="890" y="412" text-anchor="middle" class="node-title" fill="#e8c49a">业务专家</text>

  <rect x="685" y="288" width="122" height="58" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="746" y="315" text-anchor="middle" class="node-title" fill="#38bdf8">知识 Agent</text>
  <text x="746" y="334" text-anchor="middle" class="tiny">召回内部经验</text>
  <path d="M807 322 C830 322 829 338 814 346" stroke="#6ee7b7" stroke-width="1.6" fill="none" marker-end="url(#arr-mint)"/>

  <rect x="973" y="288" width="122" height="58" rx="8" fill="#111111" stroke="#5a9e6f" stroke-width="1.5"/>
  <text x="1034" y="315" text-anchor="middle" class="node-title" fill="#5a9e6f">执行 Agent</text>
  <text x="1034" y="334" text-anchor="middle" class="tiny">跑完确定动作</text>
  <path d="M966 322 C943 322 945 338 961 346" stroke="#d4a574" stroke-width="1.7" fill="none" marker-end="url(#arr-gold)"/>

  <rect x="685" y="414" width="122" height="58" rx="8" fill="#111111" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="746" y="441" text-anchor="middle" class="node-title" fill="#a78bfa">入口 Agent</text>
  <text x="746" y="460" text-anchor="middle" class="tiny">补齐业务问题</text>
  <path d="M807 438 C830 438 829 422 814 413" stroke="#d4a574" stroke-width="1.7" fill="none" marker-end="url(#arr-gold)"/>

  <rect x="973" y="414" width="122" height="58" rx="8" fill="#111111" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1034" y="441" text-anchor="middle" class="node-title" fill="#fbbf24">质检 Agent</text>
  <text x="1034" y="460" text-anchor="middle" class="tiny">守住风险边界</text>
  <path d="M966 438 C943 438 945 422 961 413" stroke="#d4a574" stroke-width="1.7" fill="none" marker-end="url(#arr-gold)"/>

  <text x="672" y="522" class="tag" fill="#e8c49a">Agent 生态扩大专家覆盖半径</text>
  <text x="672" y="551" class="panel-sub">专家判断被更多人调用，组织质量底线随之提高</text>
  <rect x="672" y="564" width="162" height="34" rx="17" fill="#251f16" stroke="#7a603f"/>
  <text x="753" y="586" text-anchor="middle" class="tag" fill="#e8c49a">价值被系统放大</text>
</svg>
