  <title id="title">Agent Version Manifest</title><desc id="desc">Agent Release 在 Run 开始时解析为不可变 Version Manifest，固定 Model、Prompt、Skill、Tool、Policy、Runtime 与 Retrieval Data 的精确版本。</desc>
