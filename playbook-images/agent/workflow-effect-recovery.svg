<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 600; fill: #111827; }
    .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrow-blue-wer" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange-wer" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="arrow-green-wer" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
    <marker id="arrow-gray-wer" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="54" class="title">流程半程失败：保留已确认效果，从未完成节点恢复</text>
  <text x="60" y="79" class="subtitle">Run 失败是流程状态；是否重试、跳过或补偿，要逐个关键节点判断</text>

  <text x="60" y="125" class="label">原始执行</text>
  <rect x="60" y="150" width="210" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="165" y="183" text-anchor="middle" class="label">S1 生成并审核邮件</text>
  <text x="165" y="210" text-anchor="middle" class="small">confirmed</text>
  <text x="165" y="235" text-anchor="middle" class="tiny">Artifact: email_draft_92</text>

  <rect x="330" y="150" width="210" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="435" y="183" text-anchor="middle" class="label">S2 发送客户邮件</text>
  <text x="435" y="210" text-anchor="middle" class="small">confirmed · accepted</text>
  <text x="435" y="235" text-anchor="middle" class="tiny">Provider Message ID: msg_73</text>

  <rect x="660" y="150" width="210" height="110" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="765" y="183" text-anchor="middle" class="label">S3 创建 CRM 跟进</text>
  <text x="765" y="210" text-anchor="middle" class="small">timeout · status unknown</text>
  <text x="765" y="235" text-anchor="middle" class="tiny">需要先确认是否提交</text>

  <rect x="930" y="150" width="210" height="110" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1035" y="183" text-anchor="middle" class="label">S4 通知负责人</text>
  <text x="1035" y="210" text-anchor="middle" class="small">not_started</text>
  <text x="1035" y="235" text-anchor="middle" class="tiny">等待 S3</text>

  <path d="M270 205 H315" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-wer)"/>
  <path d="M540 205 H595" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M606 190 L626 220 M626 190 L606 220" stroke="#dc2626" stroke-width="3"/>
  <text x="616" y="177" text-anchor="middle" class="tiny">流程中断</text>
  <path d="M637 205 H645" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-wer)"/>
  <path d="M870 205 H915" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-gray-wer)"/>

  <rect x="60" y="330" width="1080" height="105" rx="13" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="85" y="363" class="label">Checkpoint + Step Effect Records</text>
  <text x="85" y="392" class="small">S1 = confirmed · S2 = confirmed / msg_73 · S3 = unknown / idem_crm_92 · S4 = not_started</text>
  <text x="85" y="416" class="tiny">恢复依据是持久化节点事实与外部 ID，不是让模型根据 Conversation 猜测执行进度</text>

  <text x="60" y="495" class="label">恢复决策</text>
  <rect x="60" y="520" width="250" height="115" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="185" y="552" text-anchor="middle" class="label">S1 / S2：跳过</text>
  <text x="185" y="579" text-anchor="middle" class="small">结果与外部证据已确认</text>
  <text x="185" y="603" text-anchor="middle" class="tiny">不重发邮件，也不撤销邮件</text>

  <polygon points="495,510 600,577 495,644 390,577" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="495" y="565" text-anchor="middle" class="label">Reconcile S3</text>
  <text x="495" y="589" text-anchor="middle" class="small">查询 CRM 外部状态</text>
  <text x="495" y="611" text-anchor="middle" class="tiny">原 Key / External ID</text>

  <rect x="680" y="520" width="210" height="115" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="785" y="552" text-anchor="middle" class="label">S3：确认或重试</text>
  <text x="785" y="579" text-anchor="middle" class="small">已提交则保留</text>
  <text x="785" y="603" text-anchor="middle" class="tiny">未提交才使用原 Key 重试</text>

  <rect x="950" y="520" width="190" height="115" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="1045" y="552" text-anchor="middle" class="label">继续 S4</text>
  <text x="1045" y="579" text-anchor="middle" class="small">从后继节点恢复</text>
  <text x="1045" y="603" text-anchor="middle" class="tiny">不是重跑整个 Run</text>

  <path d="M435 260 V315" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-wer)"/>
  <text x="450" y="292" class="tiny">保存证据</text>
  <path d="M765 260 V315" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange-wer)"/>
  <text x="780" y="292" class="tiny">保存 unknown</text>
  <path d="M360 435 V470 H185 V505" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-wer)"/>
  <path d="M765 435 V470 H495 V495" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange-wer)"/>
  <path d="M600 577 H665" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-wer)"/>
  <path d="M890 577 H935" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-wer)"/>

  <g transform="translate(60,685)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-wer)"/><text x="42" y="4" class="tiny">已确认与继续</text>
    <line x1="170" y1="0" x2="202" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange-wer)"/><text x="212" y="4" class="tiny">未知与确认</text>
    <line x1="330" y1="0" x2="362" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-wer)"/><text x="372" y="4" class="tiny">流程推进</text>
  </g>
</svg>
