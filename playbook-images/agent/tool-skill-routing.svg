<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 600; fill: #111827; }
    .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrow-blue-tsr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange-tsr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="arrow-green-tsr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="55" class="title">从能力发现到受控执行</text>
  <text x="60" y="80" class="subtitle">Capability Registry 是本 Playbook 的参考抽象；发现、路由与授权必须分开</text>

  <rect x="60" y="125" width="220" height="105" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="170" y="163" text-anchor="middle" class="label">Goal + Current State</text>
  <text x="170" y="188" text-anchor="middle" class="small">任务、实体、环境、预算</text>
  <text x="170" y="208" text-anchor="middle" class="tiny">输入事实，不包含权限结论</text>

  <rect x="365" y="110" width="290" height="135" rx="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="510" y="145" text-anchor="middle" class="label">Capability Registry</text>
  <text x="510" y="171" text-anchor="middle" class="small">Tool · Skill · Model</text>
  <text x="510" y="192" text-anchor="middle" class="small">Agent · Workflow Branch</text>
  <text x="510" y="220" text-anchor="middle" class="tiny">来源、版本、依赖、风险、兼容性</text>

  <rect x="740" y="125" width="220" height="105" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="850" y="163" text-anchor="middle" class="label">Router</text>
  <text x="850" y="188" text-anchor="middle" class="small">硬过滤 → 检索 → 排序</text>
  <text x="850" y="208" text-anchor="middle" class="tiny">输出小规模候选集</text>

  <rect x="740" y="315" width="220" height="115" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="850" y="350" text-anchor="middle" class="label">Agent Decision</text>
  <text x="850" y="376" text-anchor="middle" class="small">加载 Skill / 选择 Tool</text>
  <text x="850" y="397" text-anchor="middle" class="small">选择 Model / Agent / Branch</text>

  <rect x="740" y="505" width="220" height="115" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="850" y="540" text-anchor="middle" class="label">Permission Check</text>
  <text x="850" y="566" text-anchor="middle" class="small">身份 · 参数 · 目标 · 风险</text>
  <text x="850" y="587" text-anchor="middle" class="tiny">允许 / 审批 / 拒绝</text>

  <rect x="1030" y="505" width="120" height="115" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="1090" y="548" text-anchor="middle" class="label">Execute</text>
  <text x="1090" y="576" text-anchor="middle" class="small">Tool / Flow</text>

  <rect x="60" y="310" width="525" height="310" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="85" y="345" class="label">候选能力的不同装载语义</text>
  <rect x="90" y="375" width="210" height="78" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="195" y="405" text-anchor="middle" class="label">Skill</text>
  <text x="195" y="430" text-anchor="middle" class="small">加载方法与资源索引</text>
  <rect x="345" y="375" width="210" height="78" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="450" y="405" text-anchor="middle" class="label">Tool</text>
  <text x="450" y="430" text-anchor="middle" class="small">暴露结构化动作接口</text>
  <rect x="90" y="490" width="210" height="78" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="195" y="520" text-anchor="middle" class="label">Model / Agent</text>
  <text x="195" y="545" text-anchor="middle" class="small">选择执行者或转移控制</text>
  <rect x="345" y="490" width="210" height="78" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="450" y="520" text-anchor="middle" class="label">Workflow Branch</text>
  <text x="450" y="545" text-anchor="middle" class="small">进入确定性流程节点</text>

  <path d="M280 177 H350" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-tsr)"/>
  <text x="315" y="166" text-anchor="middle" class="tiny">查询条件</text>
  <path d="M655 177 H725" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-tsr)"/>
  <text x="690" y="166" text-anchor="middle" class="tiny">候选资料</text>
  <path d="M850 230 V300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-tsr)"/>
  <text x="866" y="270" class="tiny">候选集</text>
  <path d="M740 373 H600 V465 H585" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green-tsr)"/>
  <text x="642" y="361" class="tiny">按类型装载</text>
  <path d="M850 430 V490" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange-tsr)"/>
  <text x="866" y="466" class="tiny">执行前强制检查</text>
  <path d="M960 562 H1015" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-tsr)"/>

  <g transform="translate(60,662)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-tsr)"/><text x="42" y="4" class="tiny">发现与路由</text>
    <line x1="150" y1="0" x2="182" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange-tsr)"/><text x="192" y="4" class="tiny">控制面检查</text>
    <line x1="310" y1="0" x2="342" y2="0" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-tsr)"/><text x="352" y="4" class="tiny">装载或执行</text>
  </g>
</svg>
