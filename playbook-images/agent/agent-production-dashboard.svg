<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Production Metrics Dashboard</title><desc id="desc">Dashboard 按 Outcome、Trajectory、Action and Safety、Cost and Latency、Runtime Health 五层展示 Agent 生产指标。</desc>
  <style>.bg{fill:#0e1115}.panel{fill:#171b21;stroke:#333a44;stroke-width:2}.white{fill:#f5f6f8}.muted{fill:#8e98a8}.hot{fill:#ff5a45}.good{fill:#55c58b}.title{font:700 30px ui-sans-serif,system-ui}.head{font:700 18px ui-sans-serif,system-ui}.big{font:700 34px ui-sans-serif,system-ui}.body{font:14px ui-sans-serif,system-ui}.mono{font:13px ui-monospace,SFMono-Regular,monospace}</style>
  <rect class="bg" width="1400" height="760" rx="26"/><text class="title white" x="54" y="62">Agent Production Health</text><text class="body muted" x="54" y="92">任务切片 · agent_version avm_42 · last 24h</text>
  <g transform="translate(54 130)">
    <rect class="panel" width="396" height="222" rx="18"/><text class="head white" x="26" y="42">Outcome</text><text class="big white" x="26" y="94">87.4%</text><text class="body muted" x="26" y="122">evidence-backed completion</text><path d="M26 170C88 130 136 190 198 150S302 116 366 142" stroke="#55c58b" stroke-width="5" fill="none"/>
    <rect class="panel" x="420" width="396" height="222" rx="18"/><text class="head white" x="446" y="42">Trajectory</text><text class="big hot" x="446" y="94">2.8%</text><text class="body muted" x="446" y="122">no-progress windows</text><g fill="#39414d"><rect x="446" y="170" width="34" height="24"/><rect x="492" y="154" width="34" height="40"/><rect x="538" y="166" width="34" height="28"/><rect class="hot" x="584" y="132" width="34" height="62"/><rect x="630" y="160" width="34" height="34"/><rect x="676" y="174" width="34" height="20"/></g>
    <rect class="panel" x="840" width="452" height="222" rx="18"/><text class="head white" x="866" y="42">Action &amp; Safety</text><text class="big white" x="866" y="94">0</text><text class="body muted" x="866" y="122">critical violations</text><text class="mono hot" x="866" y="166">effect_unknown  3</text><text class="mono muted" x="866" y="194">approval_wait p95  18m</text>
    <rect class="panel" y="246" width="606" height="268" rx="18"/><text class="head white" x="26" y="288">Cost &amp; Latency</text><text class="big white" x="26" y="344">$0.84</text><text class="body muted" x="26" y="372">median cost / completed run</text><rect x="26" y="410" width="514" height="20" rx="10" fill="#29303a"/><rect x="26" y="410" width="260" height="20" rx="10" class="hot"/><text class="mono muted" x="26" y="466">model 51% · tool 22% · sandbox 19% · human 8%</text>
    <rect class="panel" x="630" y="246" width="662" height="268" rx="18"/><text class="head white" x="656" y="288">Runtime Health</text>
    <g class="body white"><text x="656" y="336">Queue p95</text><text x="656" y="386">Checkpoint success</text><text x="656" y="436">Trace coverage</text><text x="656" y="486">Recovery success</text></g>
    <g class="mono"><text class="hot" x="1160" y="336">4.2 s</text><text class="good" x="1160" y="386">99.98%</text><text class="good" x="1160" y="436">98.7%</text><text class="good" x="1160" y="486">96.1%</text></g>
  </g>
  <text class="body muted" x="54" y="700">Metric 发现趋势 · Trace 解释因果 · Evaluation 判断质量</text>
</svg>
