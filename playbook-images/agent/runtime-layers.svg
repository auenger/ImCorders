<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Framework、Runtime、Protocol 与 Harness 分层</title>
  <desc id="desc">Framework 帮助开发者构造 Agent，Runtime 承载执行，Protocol 向外暴露稳定契约，Harness 将能力组织为具体工作方式。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .sub { font-size: 13px; fill: #6b7280; }
    .name { font-size: 19px; font-weight: 700; fill: #111827; }
    .body { font-size: 13px; fill: #4b5563; }
    .tag { font-size: 12px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="52" y="52">Agent 工程的四层责任边界</text>
  <text class="sub" x="52" y="78">外部依赖稳定语义，内部保留实现自由；Harness 将通用 Runtime 落到具体工作环境</text>

  <rect x="52" y="122" width="1096" height="110" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="name" x="82" y="158">Harness</text>
  <text class="body" x="82" y="184">仓库规范 · 默认 Skill 与 Tool · 权限政策 · 验证门禁 · 工作区与交付流程</text>
  <rect x="920" y="151" width="188" height="44" rx="22" fill="#ede9fe"/>
  <text class="tag" x="1014" y="178" fill="#7c3aed">默认可用的工作方式</text>

  <rect x="52" y="274" width="1096" height="110" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="name" x="82" y="310">Protocol</text>
  <text class="body" x="82" y="336">Agent / Thread / Run · 生命周期状态 · Event · Artifact · 创建、输入、取消、重试</text>
  <rect x="920" y="303" width="188" height="44" rx="22" fill="#ffedd5"/>
  <text class="tag" x="1014" y="330" fill="#c2410c">外部可依赖的契约</text>

  <rect x="52" y="426" width="1096" height="132" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="name" x="82" y="463">Runtime</text>
  <text class="body" x="82" y="490">Scheduler · Worker · Context Assembly · Model / Tool Executor · Run Store · Checkpoint · 权限与预算</text>
  <text class="body" x="82" y="520">承载 Agent 生命周期、状态转换、中断恢复与副作用控制</text>
  <rect x="920" y="466" width="188" height="44" rx="22" fill="#dbeafe"/>
  <text class="tag" x="1014" y="493" fill="#1d4ed8">正在运行的执行环境</text>

  <rect x="52" y="600" width="1096" height="104" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="name" x="82" y="637">Framework</text>
  <text class="body" x="82" y="663">SDK · Agent 基类 · Graph DSL · Tool 封装 · 模型适配器</text>
  <rect x="920" y="630" width="188" height="44" rx="22" fill="#dcfce7"/>
  <text class="tag" x="1014" y="657" fill="#15803d">开发者的构造工具</text>

  <path d="M600 600V570" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text class="sub" x="616" y="587">构造并配置</text>
  <path d="M600 426V396" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange)"/>
  <text class="sub" x="616" y="413">暴露稳定语义</text>
  <path d="M600 274V244" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
  <text class="sub" x="616" y="261">包装为工作规约</text>
</svg>
