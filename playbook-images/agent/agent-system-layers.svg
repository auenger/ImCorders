<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-labelledby="title desc">
  <title id="title">从一次模型调用到 Agent 系统</title>
  <desc id="desc">目标进入 Agent Runtime。Runtime 组装 Context，调用 Model 选择动作，通过 Tools 影响 Environment，再把环境反馈写入 State 并进入下一轮。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .label { font-size: 16px; font-weight: 700; fill: #111827; }
    .small { font-size: 12px; fill: #6b7280; }
    .arrow-label { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#ffffff"/>
  <text class="title" x="48" y="50">从一次模型调用到 Agent 系统</text>
  <text class="subtitle" x="48" y="76">模型负责生成判断；Runtime 把目标、状态、方法和动作组织成反馈闭环</text>

  <rect x="42" y="126" width="174" height="96" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="76" cy="163" r="17" fill="#fed7aa"/>
  <path d="M68 163h16M76 155v16" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
  <text class="label" x="104" y="162">Goal</text>
  <text class="small" x="104" y="184">目标与完成标准</text>

  <rect x="270" y="104" width="798" height="470" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="label" x="300" y="138">Agent Runtime</text>
  <text class="small" x="438" y="138">组装 Context · 校验动作 · 调度执行 · 保存状态 · 控制退出</text>

  <rect x="314" y="180" width="216" height="106" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="334" y="201" width="34" height="42" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <path d="M342 212h18M342 220h18M342 228h12" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <text class="label" x="386" y="218">Context</text>
  <text class="small" x="386" y="240">这一轮模型看见什么</text>
  <text class="small" x="334" y="266">目标 · 状态 · Skill · 观察结果</text>

  <rect x="624" y="180" width="216" height="106" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="666" cy="222" r="22" fill="#ede9fe" stroke="#7c3aed"/>
  <path d="M655 222c4-12 18-12 22 0M657 228c6 7 14 7 19 0M666 203v10" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <text class="label" x="704" y="218">Model</text>
  <text class="small" x="704" y="240">选择下一步动作</text>
  <text class="small" x="644" y="266">LLM / Rule / Policy</text>

  <rect x="314" y="354" width="180" height="112" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="label" x="338" y="389">State</text>
  <text class="small" x="338" y="413">现在做到哪里</text>
  <text class="small" x="338" y="438">进度 · 事实 · 检查点</text>

  <rect x="530" y="354" width="180" height="112" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="label" x="554" y="389">Skills</text>
  <text class="small" x="554" y="413">这类任务怎样做</text>
  <text class="small" x="554" y="438">方法 · 规则 · 模板</text>

  <rect x="746" y="354" width="180" height="112" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="label" x="770" y="389">Tools</text>
  <text class="small" x="770" y="413">能够执行什么动作</text>
  <text class="small" x="770" y="438">Read · Write · Call</text>

  <rect x="270" y="620" width="798" height="62" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text class="label" x="302" y="648">Environment</text>
  <text class="small" x="430" y="648">文件系统 · 数据库 · 浏览器 · API · 用户 · 其他 Agent · 物理世界</text>
  <text class="small" x="302" y="669">模型之外的真实状态</text>

  <path d="M216 174H302" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="236" y="163" fill="#2563eb">注入目标</text>
  <path d="M530 233H612" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="546" y="220" fill="#2563eb">请求判断</text>
  <path d="M732 286V330H836V342" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="747" y="321" fill="#2563eb">选择动作</text>
  <path d="M836 466V608" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="848" y="542" fill="#2563eb">执行</text>
  <path d="M520 620V594H404V478" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="528" y="602" fill="#059669">观察结果写回状态</text>
  <path d="M404 354V298H422V286" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="314" y="322" fill="#059669">加载当前状态</text>
  <path d="M620 354V310H490V286" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text class="arrow-label" x="524" y="334" fill="#7c3aed">加载方法</text>

  <g transform="translate(48 656)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text class="small" x="36" y="12">控制与动作</text>
    <line x1="126" y1="8" x2="154" y2="8" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text class="small" x="162" y="12">环境反馈</text>
  </g>
</svg>
