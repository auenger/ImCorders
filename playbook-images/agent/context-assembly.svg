<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Context Assembly：从信息源到当前工作集</title>
  <desc id="desc">Runtime 从目标、状态、观察、能力、记忆和历史中选择信息，经过过滤、冲突解析、排序和预算控制，形成当前模型调用使用的 Context 与可追溯的 Context Assembly Manifest。该 Manifest 是本 Playbook 扩展的设计概念，并非行业标准对象。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .sub { font-size: 13px; fill: #6b7280; }
    .head { font-size: 16px; font-weight: 700; fill: #111827; text-anchor: middle; }
    .body { font-size: 12px; fill: #6b7280; text-anchor: middle; }
    .stage { font-size: 15px; font-weight: 700; fill: #111827; text-anchor: middle; }
    .stage-sub { font-size: 11px; fill: #6b7280; text-anchor: middle; }
    .edge { font-size: 11px; font-weight: 600; fill: #2563eb; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="48" y="50">Context Assembly：每一轮都重新构造有限工作集</text>
  <text class="sub" x="48" y="76">稳定边界先保留，动态材料按需选择；最终 Context 之外同时生成可审计的组装清单</text>

  <rect x="48" y="116" width="244" height="540" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="head" x="170" y="150">信息来源</text>
  <text class="body" x="170" y="172">不是所有内容都进入这一轮</text>

  <rect x="76" y="204" width="188" height="58" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text class="head" x="170" y="228">Goal + Policy</text><text class="body" x="170" y="248">目标、验收、不可覆盖约束</text>
  <rect x="76" y="282" width="188" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="head" x="170" y="306">Run State</text><text class="body" x="170" y="326">进度、事实、任务、预算</text>
  <rect x="76" y="360" width="188" height="58" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text class="head" x="170" y="384">Observation</text><text class="body" x="170" y="404">当前环境的最新证据</text>
  <rect x="76" y="438" width="188" height="58" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text class="head" x="170" y="462">Skill + Tools</text><text class="body" x="170" y="482">当前 Task 的候选能力</text>
  <rect x="76" y="516" width="188" height="58" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <text class="head" x="170" y="540">Memory + Material</text><text class="body" x="170" y="560">按作用域检索的历史材料</text>
  <rect x="76" y="594" width="188" height="38" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text class="body" x="170" y="617">Relevant History</text>

  <rect x="350" y="116" width="488" height="540" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="594" y="150">Runtime Context Builder</text>
  <text class="body" x="594" y="172">规则与数据处理在模型调用之前完成</text>

  <rect x="398" y="208" width="392" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="stage" x="594" y="235">1 · Scope &amp; Permission Filter</text><text class="stage-sub" x="594" y="256">先按租户、项目、身份和敏感级别过滤</text>
  <rect x="398" y="304" width="392" height="66" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text class="stage" x="594" y="331">2 · Freshness &amp; Conflict Resolve</text><text class="stage-sub" x="594" y="352">比较作用域、来源、时间与证据级别</text>
  <rect x="398" y="400" width="392" height="66" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  <text class="stage" x="594" y="427">3 · Rank &amp; Transform</text><text class="stage-sub" x="594" y="448">选择片段，去重，并记录有损压缩</text>
  <rect x="398" y="496" width="392" height="92" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text class="stage" x="594" y="525">4 · Token Budget</text><text class="stage-sub" x="594" y="548">目标与约束保底 · 动态材料设上限</text>
  <text class="stage-sub" x="594" y="568">先删除低价值内容，再做摘要</text>

  <path d="M292 386H338" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M594 274V292" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M594 370V388" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M594 466V484" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="896" y="178" width="256" height="250" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="1024" y="214">Current Context</text>
  <text class="body" x="1024" y="239">这一轮模型能够看见的内容</text>
  <rect x="928" y="270" width="192" height="32" rx="7" fill="#ffffff" stroke="#bfdbfe"/><text class="body" x="1024" y="291">不可牺牲边界</text>
  <rect x="928" y="316" width="192" height="32" rx="7" fill="#ffffff" stroke="#bfdbfe"/><text class="body" x="1024" y="337">当前状态与证据</text>
  <rect x="928" y="362" width="192" height="32" rx="7" fill="#ffffff" stroke="#bfdbfe"/><text class="body" x="1024" y="383">少量能力与历史材料</text>

  <rect x="896" y="486" width="256" height="170" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="head" x="1024" y="514">Context Assembly</text>
  <text class="head" x="1024" y="536">Manifest</text>
  <text class="body" x="1024" y="560">来源引用 · 版本 · Token</text>
  <text class="body" x="1024" y="580">选择理由 · 裁剪方式</text>
  <text class="body" x="1024" y="600">冲突与省略记录</text>
  <text class="body" x="1024" y="622">用于解释与复现，不复制 Secret</text>
  <text class="body" x="1024" y="642">Playbook 扩展概念 · 非标准对象</text>

  <path d="M838 324H884" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="edge" x="861" y="313">装配</text>
  <path d="M838 548H884" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="edge" x="861" y="537">记录</text>
  <text class="sub" x="48" y="714">设计原则：相关性决定“可能有用”，作用域、权威性、新鲜度和预算共同决定“这一轮应该看见”。</text>
</svg>
