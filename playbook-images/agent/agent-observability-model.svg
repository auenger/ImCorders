<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Trace、Span 与 Event 的最小语义模型</title>
  <desc id="desc">Run 包含多个 Attempt 与 Step；Trace 由 Span 构成并关联 Event、成本、审批和外部副作用。Event Stream 独立保存可恢复的领域事实。</desc>
  <style>
    .bg{fill:#0d0f12}.panel{fill:#15181d;stroke:#30353d;stroke-width:2}.hot{fill:#ff5a45}.muted{fill:#8e98a8}.white{fill:#f5f7fa}.line{stroke:#515967;stroke-width:3;fill:none}.dash{stroke:#515967;stroke-width:2;stroke-dasharray:8 8;fill:none}.title{font:700 30px ui-sans-serif,system-ui}.head{font:700 20px ui-sans-serif,system-ui}.body{font:15px ui-sans-serif,system-ui}.mono{font:14px ui-monospace,SFMono-Regular,monospace}
  </style>
  <rect class="bg" width="1400" height="760" rx="26"/>
  <text class="title white" x="54" y="62">Agent Observability Model</text>
  <text class="body muted" x="54" y="92">业务执行语义与分布式观测语义互相引用，但不强制一一对应</text>
  <rect class="panel" x="54" y="132" width="1292" height="128" rx="18"/>
  <text class="head white" x="82" y="172">RUN · run_128</text><text class="body muted" x="82" y="199">一个目标驱动的完整执行</text>
  <rect x="310" y="157" width="210" height="70" rx="12" fill="#22262d"/><text class="head white" x="332" y="187">Attempt 1</text><text class="body muted" x="332" y="210">timeout · unknown</text>
  <rect x="554" y="157" width="210" height="70" rx="12" fill="#22262d"/><text class="head white" x="576" y="187">Attempt 2</text><text class="body hot" x="576" y="210">recovered · complete</text>
  <path class="line" d="M520 192H554"/><path class="line" d="M764 192H1292"/>
  <text class="mono muted" x="1084" y="187">agent_version avm_42</text><text class="mono muted" x="1084" y="210">checkpoint cp_8</text>
  <rect class="panel" x="54" y="292" width="840" height="304" rx="18"/>
  <text class="head white" x="82" y="334">TRACE · 因果路径与耗时</text>
  <rect x="88" y="374" width="752" height="54" rx="10" fill="#22262d"/><rect class="hot" x="88" y="374" width="242" height="54" rx="10"/>
  <text class="body white" x="106" y="407">invoke_agent</text><text class="mono muted" x="692" y="407">44.2 s</text>
  <rect x="140" y="456" width="218" height="48" rx="9" fill="#27303a"/><text class="body white" x="158" y="486">assemble_context</text>
  <rect x="382" y="456" width="192" height="48" rx="9" fill="#27303a"/><text class="body white" x="400" y="486">model_decision</text>
  <rect x="598" y="456" width="192" height="48" rx="9" fill="#27303a"/><text class="body white" x="616" y="486">execute_tool</text>
  <path class="dash" d="M249 428V456M478 428V456M694 428V456"/>
  <text class="mono muted" x="92" y="548">trace_id · span_id · run_id · attempt_id · step_id · tool_call_id</text>
  <rect class="panel" x="926" y="292" width="420" height="304" rx="18"/>
  <text class="head white" x="954" y="334">EVENT STREAM · 领域事实</text>
  <path class="line" d="M982 382V542"/>
  <circle class="hot" cx="982" cy="386" r="8"/><text class="body white" x="1010" y="392">run.accepted</text>
  <circle fill="#778292" cx="982" cy="435" r="8"/><text class="body white" x="1010" y="441">tool.requested</text>
  <circle fill="#778292" cx="982" cy="484" r="8"/><text class="body white" x="1010" y="490">effect.unknown</text>
  <circle class="hot" cx="982" cy="533" r="8"/><text class="body white" x="1010" y="539">run.completed</text>
  <rect x="54" y="628" width="1292" height="78" rx="14" fill="#111419" stroke="#30353d"/>
  <text class="body white" x="82" y="660">Trace 可采样，用于定位路径与性能</text><text class="body muted" x="82" y="687">恢复、审计与副作用账本所依赖的 Event 不应随 Trace 采样丢失</text>
</svg>
