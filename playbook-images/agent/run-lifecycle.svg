<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Agent Run 生命周期状态机</title>
  <desc id="desc">Run 从提交、排队进入运行，可因输入、授权和外部事件暂停并恢复，也可请求取消，最终进入完成、失败、超时或取消终态。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .sub { font-size: 13px; fill: #6b7280; }
    .state { font-size: 14px; font-weight: 700; fill: #111827; text-anchor: middle; }
    .note { font-size: 11px; fill: #6b7280; text-anchor: middle; }
    .edge { font-size: 11px; font-weight: 600; fill: #6b7280; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text class="title" x="52" y="52">Run 生命周期：暂停是状态，取消是过程，完成需要证据</text>
  <text class="sub" x="52" y="78">蓝色为正常推进与恢复，橙色为等待分流，红色为取消路径</text>

  <circle cx="78" cy="170" r="9" fill="#111827"/>
  <rect x="126" y="132" width="160" height="76" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="state" x="206" y="164">SUBMITTED</text><text class="note" x="206" y="187">已接受并持久化</text>
  <rect x="356" y="132" width="160" height="76" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="state" x="436" y="164">QUEUED</text><text class="note" x="436" y="187">等待调度资源</text>
  <rect x="590" y="126" width="184" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="state" x="682" y="163">RUNNING</text><text class="note" x="682" y="188">Worker 正在推进 Run</text>
  <path d="M87 170H114" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M286 170H344" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M516 170H578" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>

  <rect x="128" y="330" width="190" height="82" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="state" x="223" y="364">INPUT_REQUIRED</text><text class="note" x="223" y="388">等待信息或选择</text>
  <rect x="396" y="330" width="190" height="82" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="state" x="491" y="364">AUTH_REQUIRED</text><text class="note" x="491" y="388">等待具体动作授权</text>
  <rect x="664" y="330" width="190" height="82" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="state" x="759" y="364">WAITING</text><text class="note" x="759" y="388">等待事件或时间条件</text>
  <path d="M636 214V266H223V318" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#orange)"/>
  <path d="M660 214V286H491V318" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#orange)"/>
  <path d="M686 214V318" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#orange)"/>
  <path d="M223 330V266H620V214" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#blue)"/>
  <path d="M491 330V286H646V214" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#blue)"/>
  <path d="M759 330V266H712V214" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#blue)"/>

  <rect x="930" y="126" width="210" height="88" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="state" x="1035" y="162">CANCEL_REQUESTED</text><text class="note" x="1035" y="188">停止新动作并等待收敛</text>
  <path d="M774 170H918" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
  <text class="edge" x="828" y="158">cancel()</text>

  <rect x="86" y="584" width="220" height="90" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="state" x="196" y="621">COMPLETED</text><text class="note" x="196" y="648">完成证据通过</text>
  <rect x="350" y="584" width="220" height="90" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="state" x="460" y="621">FAILED</text><text class="note" x="460" y="648">保留明确失败原因</text>
  <rect x="614" y="584" width="220" height="90" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="state" x="724" y="621">TIMED_OUT</text><text class="note" x="724" y="648">超过 Run 总截止时间</text>
  <rect x="878" y="584" width="220" height="90" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="state" x="988" y="621">CANCELED</text><text class="note" x="988" y="648">迟到结果已被栅栏拒绝</text>

  <path d="M620 214V516H196V572" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text class="edge" x="280" y="505">完成验证通过</text>
  <path d="M660 214V486H460V572" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#blue)"/>
  <text class="edge" x="476" y="475">不可恢复错误</text>
  <path d="M700 214V516H724V572" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#blue)"/>
  <text class="edge" x="716" y="505">Run deadline</text>
  <path d="M1035 214V572" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
  <text class="edge" x="1048" y="463">Worker 停止 / 租约失效</text>

  <g transform="translate(52 790)">
    <circle cx="8" cy="8" r="6" fill="#111827"/><text class="sub" x="24" y="12">初始状态</text>
    <circle cx="132" cy="8" r="10" fill="none" stroke="#111827"/><circle cx="132" cy="8" r="6" fill="#111827"/><text class="sub" x="150" y="12">终态：完成、失败、超时、取消</text>
  </g>
</svg>
