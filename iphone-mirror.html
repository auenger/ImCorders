<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>iPhone 投屏 · QuickTime 实时展示</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24312c; background: #f3f4f0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
    aside { padding: 48px 32px; display: flex; flex-direction: column; border-right: 1px solid #dde1da; }
    .eyebrow { font-size: 12px; letter-spacing: .15em; color: #66786e; }
    h1 { font-size: 30px; font-weight: 600; letter-spacing: -.04em; margin: 18px 0 12px; }
    p, li { font-size: 14px; line-height: 1.8; color: #667269; }
    ol { padding-left: 20px; margin: 24px 0 32px; }
    li + li { margin-top: 12px; }
    button { font: inherit; font-size: 14px; border: 1px solid #cdd5cd; border-radius: 8px; background: transparent; color: inherit; padding: 12px 16px; cursor: pointer; }
    button:hover:not(:disabled) { background: #e7ebe4; }
    button:focus-visible { outline: 3px solid #789b88; outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: default; }
    #connect { background: #284c3c; border-color: #284c3c; color: white; }
    #connect:hover:not(:disabled) { background: #365e4c; }
    .actions { display: grid; gap: 10px; }
    #status { min-height: 52px; overflow-wrap: anywhere; }
    .note { margin-top: auto; padding-top: 32px; font-size: 12px; }
    #stage { min-width: 0; display: flex; flex-direction: column; background: #e7eae4; }
    .stage-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 28px; font-size: 12px; color: #657369; }
    .indicator { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #9ba79c; margin-right: 8px; }
    .live .indicator { background: #338657; }
    .viewport { flex: 1; min-height: 440px; display: grid; place-items: center; padding: 16px 28px 36px; }
    .screen { width: 100%; display: grid; place-items: center; }
    video { display: block; max-width: 100%; width: auto; height: auto; max-height: calc(100svh - 132px); background: #151b18; border-radius: 16px; box-shadow: 0 18px 48px #24312c24; }
    .placeholder { width: min(300px, 100%); aspect-ratio: 9 / 18; border: 1px solid #c1cbbf; border-radius: 32px; display: grid; place-content: center; text-align: center; padding: 24px; color: #72816f; }
    .placeholder svg { margin: 0 auto 20px; }
    .placeholder strong { font-size: 16px; font-weight: 500; }
    .placeholder p { font-size: 12px; }
    [hidden] { display: none !important; }
    #stage:fullscreen { background: #111612; }
    #stage:fullscreen .stage-bar { color: #c5d1c6; }
    #stage:fullscreen button { color: #c5d1c6; border-color: #526054; }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      aside { padding: 28px 24px; border-right: 0; }
      ol { margin: 12px 0 20px; }
      .note { margin: 0; padding-top: 8px; }
      .actions { grid-template-columns: 1fr 1fr; }
      #status { min-height: 0; }
      .stage-bar { padding: 16px 24px; }
      video { max-height: 75svh; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <span class="eyebrow">LIVE PREVIEW</span>
      <h1>iPhone 投屏</h1>
      <p>直接操作手机，在网页中同步展示屏幕。</p>
      <ol>
        <li>用数据线连接 iPhone 与 Mac，解锁手机并信任电脑。</li>
        <li>打开 QuickTime Player → 文件 → 新建影片录制，在录制按钮旁的菜单中选择连接的 iPhone。保持屏幕预览，无需录制。</li>
        <li>点击下方按钮，共享 QuickTime 窗口，然后直接操作手机。</li>
      </ol>
      <div class="actions">
        <button id="connect" type="button">选择 QuickTime 窗口</button>
        <button id="stop" type="button" disabled>停止展示</button>
      </div>
      <p id="status" role="status" aria-live="polite">等待连接</p>
      <p class="note">画面仅在当前浏览器中展示，不会上传。网页中的画面仅供观看。</p>
    </aside>
    <section id="stage" aria-label="手机实时画面">
      <div class="stage-bar">
        <span><span class="indicator"></span><span id="label">尚未共享</span></span>
        <button id="fullscreen" type="button" disabled>全屏展示</button>
      </div>
      <div class="viewport">
        <div class="screen">
          <div id="placeholder" class="placeholder">
            <svg width="36" height="52" viewBox="0 0 36 52" fill="none" aria-hidden="true"><rect x="5" y="2" width="26" height="48" rx="7" stroke="currentColor" stroke-width="1.5"/><path d="M14 7h8M14 45h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <strong>等待你的 iPhone</strong>
            <p>选择窗口后，实时画面会显示在这里</p>
          </div>
          <video id="phone" autoplay muted playsinline hidden aria-label="共享窗口的实时视频"></video>
        </div>
      </div>
    </section>
  </main>
  <script>
    const video = document.querySelector('#phone');
    const connect = document.querySelector('#connect');
    const stop = document.querySelector('#stop');
    const fullscreen = document.querySelector('#fullscreen');
    const stage = document.querySelector('#stage');
    const status = document.querySelector('#status');
    const label = document.querySelector('#label');
    const placeholder = document.querySelector('#placeholder');
    let stream = null;

    function render() {
      const active = Boolean(stream);
      video.hidden = !active;
      placeholder.hidden = active;
      stop.disabled = !active;
      fullscreen.disabled = !active;
      stage.classList.toggle('live', active);
      label.textContent = active ? '正在实时展示' : '尚未共享';
      connect.textContent = active ? '更换共享窗口' : '选择 QuickTime 窗口';
    }

    function disconnect() {
      stream?.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      status.textContent = '共享已停止，可以重新选择窗口。';
      render();
    }

    connect.addEventListener('click', async () => {
      connect.disabled = true;
      let next = null;
      try {
        next = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: 'window', frameRate: { ideal: 30 } },
          audio: false
        });
        const track = next.getVideoTracks()[0];
        if (!track || track.readyState === 'ended') throw new Error('窗口共享已结束，请重新选择。');
        video.srcObject = next;
        await video.play();
        stream?.getTracks().forEach(oldTrack => oldTrack.stop());
        stream = next;
        track.addEventListener('ended', () => {
          if (stream === next) disconnect();
        });
        status.textContent = '已连接。请直接操作 iPhone，保持 QuickTime 屏幕预览开启。';
      } catch (error) {
        next?.getTracks().forEach(track => track.stop());
        video.srcObject = stream;
        const messages = {
          NotAllowedError: '未开始共享。请选择窗口并允许共享；如仍失败，请检查 macOS 的屏幕录制权限。',
          NotReadableError: '无法读取窗口画面，请检查 macOS 屏幕录制权限，并确认 QuickTime 正在预览手机屏幕。',
          AbortError: '共享已取消，可以重新选择窗口。',
          NotFoundError: '没有找到可共享的窗口，请先打开 QuickTime 的手机屏幕预览。'
        };
        status.textContent = messages[error.name] || `无法开始共享：${error.message}`;
      } finally {
        connect.disabled = false;
        render();
      }
    });

    stop.addEventListener('click', disconnect);
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await stage.requestFullscreen();
      } catch {
        status.textContent = '当前浏览器无法进入全屏，请直接放大浏览器窗口。';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreen.textContent = document.fullscreenElement ? '退出全屏' : '全屏展示';
    });
    window.addEventListener('pagehide', disconnect);
    if (!window.isSecureContext || !navigator.mediaDevices?.getDisplayMedia) {
      connect.disabled = true;
      status.textContent = '当前环境不支持窗口共享。请用桌面 Chrome 或 Edge，通过 localhost 或 HTTPS 打开本页。';
    }
    if (!document.fullscreenEnabled) fullscreen.hidden = true;
  </script>
</body>
</html>
